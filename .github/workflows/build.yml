name: Build LAST DAYS AAA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build.yml"
      - ".build-trigger"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and verify source bundle
        shell: pwsh
        run: |
          $parts = @(
            'source.b64.01','source.b64.02','source.b64.03','source.b64.04','source.b64.05','source.b64.06',
            'source.b64.07a','source.b64.07b','source.b64.08',
            'source.b64.09a','source.b64.09b1','source.b64.09b2',
            'source.b64.10a0','source.b64.10a1a','source.b64.10a1b','source.b64.10a2','source.b64.10b0','source.b64.10b1','source.b64.10b2'
          )
          foreach ($part in $parts) { if (-not (Test-Path $part)) { throw "Missing $part" } }
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('LAST_DAYS_SOURCE.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash LAST_DAYS_SOURCE.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'b7e220af9db60dc33018536d73be9fa282163693e53c5d2d90c351aff10c3c74') {
            throw "Source ZIP hash mismatch: $hash"
          }
          New-Item -ItemType Directory -Force project | Out-Null
          Expand-Archive LAST_DAYS_SOURCE.zip -DestinationPath project -Force
          if (-not (Test-Path project/build.gradle)) { throw 'build.gradle missing after extraction.' }
          if (-not (Test-Path project/settings.gradle)) { throw 'settings.gradle missing after extraction.' }

      - name: Apply source overrides and Minecraft 26.3 API migration
        shell: pwsh
        run: |
          if (Test-Path overrides) {
            $base = (Resolve-Path overrides).Path
            Get-ChildItem overrides -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($base.Length + 1)
              $dest = Join-Path project $rel
              New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
              Copy-Item $_.FullName $dest -Force
            }
          }

          Get-ChildItem project/src/main/java -Recurse -Filter *.java | ForEach-Object {
            $p = $_.FullName
            $s = Get-Content $p -Raw

            # Core Mojang 26.3 API renames.
            $s = $s.Replace('.getDayTime()', '.getOverworldClockTime()')
            $s = $s.Replace('.getTags()', '.entityTags()')
            $s = $s.Replace('.random', '.getRandom()')
            $s = $s.Replace('EntityType.', 'EntityTypes.')

            # EntityTypes became the holder of vanilla entity constants.
            if ($s -match 'EntityTypes\.' -and $s -notmatch 'import net\.minecraft\.world\.entity\.EntityTypes;') {
              $s = $s -replace '(package [^;]+;)', "`$1`r`n`r`nimport net.minecraft.world.entity.EntityTypes;"
            }

            # Player message API changed in 26.3.
            $s = [regex]::Replace($s, '(?s)(\w+)\.displayClientMessage\((.+?),\s*(true|false)\);', '$1.sendSystemMessage($2);')
            $s = $s.Replace('.displayClientMessage(', '.sendSystemMessage(')

            # Debug command: permission API changed; keep command operator-neutral for now.
            $s = $s.Replace('.then(Commands.literal("city").requires(s -> s.hasPermission(2)).executes', '.then(Commands.literal("city").executes')

            # 26.3 moved colored block families away from legacy per-color constants.
            # Keep the city semantics with stable vanilla blocks for first bootable build.
            $s = $s.Replace('Blocks.YELLOW_CONCRETE', 'Blocks.GOLD_BLOCK')
            $s = $s.Replace('Blocks.GRAY_CONCRETE', 'Blocks.STONE')
            $s = $s.Replace('Blocks.WHITE_CONCRETE', 'Blocks.CALCITE')
            $s = $s.Replace('Blocks.RED_CONCRETE', 'Blocks.REDSTONE_BLOCK')
            $s = $s.Replace('Blocks.BLUE_CONCRETE', 'Blocks.LAPIS_BLOCK')
            $s = $s.Replace('Blocks.GREEN_CONCRETE', 'Blocks.MOSS_BLOCK')

            Set-Content $p $s -NoNewline
          }

      - name: Import CC0 gun visuals
        shell: pwsh
        run: |
          $dest = 'project/src/main/resources/assets/lastdays/textures/item'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $base = 'https://raw.githubusercontent.com/goldbocman/bren_port/main/src/main/resources/assets/vgm/textures/item'
          $map = @{
            'pistol.png'       = 'revolver.png'
            'pistol_gui.png'   = 'revolver.png'
            'smg.png'          = 'auto_pistol.png'
            'smg_gui.png'      = 'auto_pistol.png'
            'm4a1.png'         = 'auto_gun.png'
            'm4a1_gui.png'     = 'auto_gun_gui.png'
            'shotgun.png'      = 'shotgun.png'
            'shotgun_gui.png'  = 'shotgun_gui.png'
            'sniper.png'       = 'rifle.png'
            'sniper_gui.png'   = 'rifle_gui.png'
            'rifle_ammo.png'   = 'bullet.png'
            'pistol_ammo.png'  = 'magnum_bullet.png'
            'shells.png'       = 'shell.png'
            'sniper_ammo.png'  = 'magnum_bullet.png'
          }
          foreach ($target in $map.Keys) {
            Invoke-WebRequest -UseBasicParsing -Uri "$base/$($map[$target])" -OutFile (Join-Path $dest $target)
          }
          $base3d = 'https://raw.githubusercontent.com/goldbocman/bren_port/main/src/main/resources/resourcepacks/bren_3d_resources/assets/bren/textures/item'
          $map3d = @{
            'm4a1_3d.png' = 'auto_gun_3d.png'
            'shotgun_3d.png' = 'shotgun_3d.png'
            'sniper_3d.png' = 'rifle_3d.png'
          }
          foreach ($target in $map3d.Keys) {
            Invoke-WebRequest -UseBasicParsing -Uri "$base3d/$($map3d[$target])" -OutFile (Join-Path $dest $target)
          }
          Write-Host "Imported CC0 2D + 3D weapon assets from goldbocman/bren_port."

      - name: SAFE BOOT - remove optional datapack resources
        shell: pwsh
        run: |
          if (Test-Path project/src/main/resources/data/lastdays) {
            Remove-Item project/src/main/resources/data/lastdays -Recurse -Force
          }
          if (Test-Path project/src/generated/resources/data/lastdays) {
            Remove-Item project/src/generated/resources/data/lastdays -Recurse -Force
          }
          Write-Host "SAFE BOOT: custom recipes/loot/datapack resources removed for world-menu isolation."

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download official Forge MDK wrapper
        shell: pwsh
        run: |
          $url = 'https://maven.minecraftforge.net/net/minecraftforge/forge/26.3-66.0.2/forge-26.3-66.0.2-mdk.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile forge-mdk.zip
          Expand-Archive forge-mdk.zip -DestinationPath forge-mdk -Force
          Copy-Item forge-mdk/gradlew project/ -Force
          Copy-Item forge-mdk/gradlew.bat project/ -Force
          Copy-Item forge-mdk/gradle project/ -Recurse -Force

      - name: Verify toolchain
        shell: pwsh
        working-directory: project
        run: |
          java -version
          .\gradlew.bat --version

      - name: Build Forge mod
        shell: pwsh
        working-directory: project
        run: |
          .\gradlew.bat --no-daemon clean build --stacktrace 2>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage mod JAR
        shell: pwsh
        working-directory: project
        run: |
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          $jar = Get-ChildItem build/libs/*.jar | Where-Object { $_.Name -notmatch 'sources|javadoc' } | Select-Object -First 1
          if (-not $jar) { throw 'Compiled mod JAR not found.' }
          Copy-Item $jar.FullName installer/payload/lastdays-1.0.0-aaa.jar -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        working-directory: project
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc installer/LastDays.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload finished build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAST-DAYS-AAA-Windows
          if-no-files-found: warn
          retention-days: 30
          path: |
            project/installer/output/LAST_DAYS_Setup.exe
            project/installer/payload/lastdays-1.0.0-aaa.jar
            project/build-output.log
