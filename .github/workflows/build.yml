name: Build LAST DAYS AAA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover complete source tree from bundle
        shell: pwsh
        run: |
          $parts = 1..9 | ForEach-Object { "source.b64.{0:D2}" -f $_ }
          foreach ($part in $parts) {
            if (-not (Test-Path $part)) { throw "Missing bundle part: $part" }
          }
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('LAST_DAYS_SOURCE.partial.zip', [Convert]::FromBase64String($b64))

          @'
          import pathlib, struct, zlib, binascii

          src = pathlib.Path("LAST_DAYS_SOURCE.partial.zip").read_bytes()
          root = pathlib.Path("project")
          root.mkdir(exist_ok=True)

          LOCAL = b"PK\x03\x04"
          pos = 0
          count = 0

          while pos + 30 <= len(src):
              if src[pos:pos+4] != LOCAL:
                  break

              sig, ver, flags, method, mtime, mdate, crc, csize, usize, fnlen, exlen = struct.unpack_from(
                  "<4s5H3I2H", src, pos
              )
              if flags & 0x08:
                  raise RuntimeError("Unsupported data-descriptor ZIP entry")

              name_start = pos + 30
              name_end = name_start + fnlen
              data_start = name_end + exlen
              data_end = data_start + csize
              if data_end > len(src):
                  raise RuntimeError("Truncated file payload before central directory")

              raw_name = src[name_start:name_end]
              name = raw_name.decode("utf-8" if flags & 0x800 else "cp437")
              target = (root / name).resolve()
              root_resolved = root.resolve()
              if root_resolved not in target.parents and target != root_resolved:
                  raise RuntimeError(f"Unsafe path in bundle: {name}")

              if name.endswith("/"):
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  payload = src[data_start:data_end]
                  if method == 0:
                      data = payload
                  elif method == 8:
                      data = zlib.decompress(payload, -15)
                  else:
                      raise RuntimeError(f"Unsupported compression method {method} for {name}")

                  if len(data) != usize:
                      raise RuntimeError(f"Size mismatch for {name}")
                  if (binascii.crc32(data) & 0xffffffff) != crc:
                      raise RuntimeError(f"CRC mismatch for {name}")

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

              count += 1
              pos = data_end

          print(f"Recovered {count} ZIP entries; local-file stream ended at byte {pos}.")
          required = [
              root / "build.gradle",
              root / "settings.gradle",
              root / "src/main/java/de/janzimmermann/lastdays/LastDays.java",
              root / "src/main/resources/META-INF/mods.toml",
              root / "installer/LastDays.iss",
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise RuntimeError("Recovered source is incomplete: " + ", ".join(missing))
          if count < 100:
              raise RuntimeError(f"Expected at least 100 recovered entries, got {count}")
          '@ | python -

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download official Forge MDK wrapper
        shell: pwsh
        run: |
          $url = 'https://maven.minecraftforge.net/net/minecraftforge/forge/26.3-66.0.2/forge-26.3-66.0.2-mdk.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile forge-mdk.zip
          Expand-Archive forge-mdk.zip -DestinationPath forge-mdk -Force
          Copy-Item forge-mdk/gradlew project/ -Force
          Copy-Item forge-mdk/gradlew.bat project/ -Force
          Copy-Item forge-mdk/gradle project/ -Recurse -Force

      - name: Verify toolchain
        shell: pwsh
        working-directory: project
        run: |
          java -version
          .\gradlew.bat --version

      - name: Build Forge mod
        shell: pwsh
        working-directory: project
        run: |
          .\gradlew.bat --no-daemon clean build --stacktrace 2>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage mod JAR
        shell: pwsh
        working-directory: project
        run: |
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          $jar = Get-ChildItem build/libs/*.jar | Where-Object { $_.Name -notmatch 'sources|javadoc' } | Select-Object -First 1
          if (-not $jar) { throw 'Compiled mod JAR not found.' }
          Copy-Item $jar.FullName installer/payload/lastdays-1.0.0-aaa.jar -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        working-directory: project
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }
          & $iscc installer/LastDays.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload finished build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAST-DAYS-AAA-Windows
          if-no-files-found: warn
          retention-days: 30
          path: |
            project/installer/output/LAST_DAYS_Setup.exe
            project/installer/payload/lastdays-1.0.0-aaa.jar
            project/build-output.log
